name: BindPlane One-Click Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
    # -------------------------------------------------
    # 1️⃣ Checkout
    # -------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # -------------------------------------------------
    # 2️⃣ Terraform
    # -------------------------------------------------
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.6

    # -------------------------------------------------
    # 3️⃣ Authenticate to GCP
    # -------------------------------------------------
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set GCP project
      run: gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

    # -------------------------------------------------
    # 4️⃣ Dependencies
    # -------------------------------------------------
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq curl

    # -------------------------------------------------
    # 5️⃣ Terraform Init
    # -------------------------------------------------
    - name: Terraform Init
      working-directory: terraform
      run: terraform init

    # -------------------------------------------------
    # 6️⃣ STEP 1 — Core Infra (CloudSQL → VM → BindPlane Server)
    # -------------------------------------------------
    - name: Apply Core Infrastructure
      working-directory: terraform
      run: |
        terraform apply -auto-approve \
          -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
          -var="region=${{ secrets.GCP_REGION }}" \
          -var="zone=${{ secrets.GCP_ZONE }}" \
          -var="alert_email=${{ secrets.ALERT_EMAIL }}" \
          -var="bindplane_admin_password=${{ secrets.BINDPLANE_ADMIN_PASSWORD }}" \
          -var="bindplane_db_password=${{ secrets.BINDPLANE_DB_PASSWORD }}" \
          -var="bindplane_license_key=${{ secrets.BINDPLANE_LICENSE_KEY }}"

    # -------------------------------------------------
    # 7️⃣ STEP 2 — Wait for BindPlane to be READY
    # -------------------------------------------------
    - name: Wait for BindPlane UI
      working-directory: terraform
      run: |
        SERVER_IP=$(terraform output -raw bindplane_vm_ip)

        echo "Waiting for BindPlane server..."
        for i in {1..30}; do
          if curl -sf http://$SERVER_IP:3001/version; then
            echo "BindPlane is up"
            exit 0
          fi
          sleep 10
        done

        echo "BindPlane did not start"
        exit 1

    # -------------------------------------------------
    # 8️⃣ STEP 3 — Generate BindPlane API Key (runtime)
    # -------------------------------------------------
    - name: Generate BindPlane API Key
      working-directory: terraform
      run: |
        SERVER_IP=$(terraform output -raw bindplane_vm_ip)

        TOKEN=$(curl -s -X POST http://$SERVER_IP:3001/v1/session \
          -H "Content-Type: application/json" \
          -d "{
            \"username\": \"admin\",
            \"password\": \"${{ secrets.BINDPLANE_ADMIN_PASSWORD }}\"
          }" | jq -r '.token')

        if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
          echo "Failed to login to BindPlane"
          exit 1
        fi

        API_KEY=$(curl -s -X POST http://$SERVER_IP:3001/v1/api-keys \
          -H "Authorization: Bearer $TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"name":"terraform-auto-key"}' | jq -r '.key')

        if [ -z "$API_KEY" ] || [ "$API_KEY" = "null" ]; then
          echo "Failed to create API key"
          exit 1
        fi

        echo "bindplane_api_key=\"$API_KEY\"" > terraform/bindplane.auto.tfvars

        echo "BindPlane API key generated"

    # -------------------------------------------------
    # 9️⃣ STEP 4 — Apply Pipelines, Agents, GCS, GCO, Alerts
    # -------------------------------------------------
    - name: Apply BindPlane Pipelines & Observability
      working-directory: terraform
      run: |
        terraform apply -auto-approve \
          -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
          -var="region=${{ secrets.GCP_REGION }}" \
          -var="zone=${{ secrets.GCP_ZONE }}" \
          -var="alert_email=${{ secrets.ALERT_EMAIL }}"

    # -------------------------------------------------
    # 🔟 Outputs
    # -------------------------------------------------
    - name: Deployment Summary
      working-directory: terraform
      run: |
        terraform output
